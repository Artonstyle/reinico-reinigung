<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REINICO · Meine Arbeitszeit</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#183553;font:16px system-ui}header{background:#194c7d;color:white;padding:24px}header div,main{max-width:560px;margin:auto}main{padding:18px}.card{background:white;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 6px 24px #1835530b}h1{font-size:24px;margin:0}h2{font-size:19px}label{display:block;margin:15px 0}input,select,button{font:inherit;padding:13px;border-radius:9px;border:1px solid #c4d3e1;width:100%;margin-top:6px}button{cursor:pointer;background:#2464a4;color:white;border:0}button.secondary{background:#eaf1f8;color:#234d78}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}.buttons{display:grid;gap:10px}#duration{font-size:44px;font-weight:750;font-variant-numeric:tabular-nums}#phase{display:inline-block;background:#edf5fc;padding:9px 14px;border-radius:8px;margin:15px 0}.event{border-bottom:1px solid #e4ebf1;padding:13px 0}.event small{display:block;color:#667c91;margin-top:4px}#notice{white-space:pre-wrap;line-height:1.5}footer{font-size:13px;color:#697f93;text-align:center}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e5ad43}</style></head>
<body><header><div><h1>REINICO</h1>Meine Arbeitszeit</div></header><main>
<section class="card" id="login"><h2>Mitarbeiter-Anmeldung</h2><form id="loginForm"><label>E-Mail-Adresse<input name="email" type="email" autocomplete="username" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button>Anmelden</button></form></section>
<div id="portal" hidden><section class="card"><h2 id="person"></h2><div id="phase"></div><label>Einsatzort<select id="object"><option value="">Einsatzort auswählen</option></select><small>Die Auswahl kommt aus der CRM-Objektliste.</small></label><div>Arbeitszeit ohne Pausen</div><div id="duration">00:00:00</div><div class="buttons"><button data-type="Start">Kommen · Arbeit starten</button><button data-type="Pause">Pause starten</button><button data-type="Weiter">Weiterarbeiten</button><button data-type="Ende">Gehen · Feierabend</button><button class="secondary" id="refresh">Status aktualisieren</button></div></section><section class="card"><h2>Gespeicherter Stempelverlauf</h2><div id="history"></div></section><button class="secondary" id="logout">Abmelden</button></div>
<p id="notice" role="status"></p><footer>Live-Daten · Buchungszeit vom Server.<br>Bei Verbindungsfehlern wird keine Buchung als gespeichert angezeigt.</footer></main>
<script>
const API='https://script.google.com/macros/s/AKfycbxDe5bZSg93330EzrFOXErHoBvGnJYEFz8KLk95q7s4n7ie9UIv05E1VzOQw70JfJU/exec',SUPABASE='https://pgcjsyzoukyynkufupms.supabase.co',KEY='sb_publishable_uyKhe83Crckp93AjCrIruw_NAuV16p2';
const el=id=>document.getElementById(id);let token='',expires=0,state=null,offset=0,busy=false,pending=null;
async function api(action,extra={}){if(!token||Date.now()>=expires)throw Error('Bitte erneut anmelden.');const response=await fetch(API,{method:'POST',body:new URLSearchParams({action,access_token:token,...extra}),signal:AbortSignal.timeout(30000)});const result=await response.json();if(!response.ok||result.result!=='success')throw Error(result.msg||'Verbindung fehlgeschlagen.');return result;}
function draw(result){state=result.state;offset=result.serverNow-Date.now();el('person').textContent='Hallo, '+result.employee.name;el('phase').textContent={idle:'Noch nicht gestartet',done:'Feierabend',work:'Bei der Arbeit',pause:'In Pause'}[state.phase];const selected=el('object').value;el('object').replaceChildren(new Option('Einsatzort auswählen',''));if(!Array.isArray(result.objects))throw Error('Bitte zuerst die aktualisierte reinico-stempel.gs bereitstellen.');for(const name of result.objects)el('object').add(new Option(name,name));if(['work','pause'].includes(state.phase)&&state.object&&!result.objects.includes(state.object))el('object').add(new Option(state.object+' (laufender Einsatz)',state.object));el('object').value=['work','pause'].includes(state.phase)?state.object:(result.objects.includes(selected)?selected:'');el('object').disabled=['work','pause'].includes(state.phase);el('history').replaceChildren();for(const event of [...result.events].reverse()){const row=document.createElement('div');row.className='event';row.textContent=event.typ+' · '+event.objekt;const time=document.createElement('small');time.textContent=event.datumzeit;row.append(time);el('history').append(row)}if(!result.events.length)el('history').textContent='Noch keine Buchung gespeichert.';buttons();tick();}
function buttons(){const allowed={idle:['Start'],done:['Start'],work:['Pause','Ende'],pause:['Weiter','Ende']};document.querySelectorAll('[data-type]').forEach(button=>button.disabled=busy||!state||!allowed[state.phase].includes(button.dataset.type));el('refresh').disabled=busy;}
function tick(){if(!state)return;const ms=Math.max(0,state.worked+(state.phase==='work'?Date.now()+offset-state.segmentStart:0)),s=Math.floor(ms/1000);el('duration').textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');}
el('loginForm').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');button.disabled=true;el('notice').textContent='Anmeldung wird geprüft …';try{const response=await fetch(SUPABASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:form.elements.email.value.trim(),password:form.elements.password.value}),signal:AbortSignal.timeout(30000)});const session=await response.json();if(!response.ok||!session.access_token)throw Error('E-Mail oder Passwort nicht korrekt.');token=session.access_token;expires=Date.now()+session.expires_in*1000;draw(await api('reinico_stamp_state'));form.elements.password.value='';el('login').hidden=true;el('portal').hidden=false;el('notice').textContent='Gespeicherten Status geladen.';}catch(error){token='';el('notice').textContent=error.message;}finally{button.disabled=false;}};
document.querySelectorAll('[data-type]').forEach(button=>button.onclick=async()=>{if(busy)return;const typ=button.dataset.type,objekt=el('object').value.trim();if(typ==='Start'&&(!objekt||/^[=+@-]/.test(objekt))){el('notice').textContent='Bitte zuerst einen Einsatzort aus der CRM-Objektliste auswählen.';el('object').focus();return;}busy=true;buttons();if(!pending||pending.typ!==typ||pending.objekt!==objekt)pending={typ,objekt,buchungsid:crypto.randomUUID()};el('notice').textContent='Buchung wird gespeichert …';try{draw(await api('reinico_stamp',pending));pending=null;el('notice').textContent='Buchung gespeichert.';}catch(error){el('notice').textContent=error.message+'\nStatus aktualisieren oder dieselbe Buchung erneut versuchen. Nicht offline gespeichert.';}finally{busy=false;buttons();}});
el('refresh').onclick=async()=>{busy=true;buttons();try{draw(await api('reinico_stamp_state'));el('notice').textContent='Status aktualisiert.';}catch(error){el('notice').textContent=error.message;}finally{busy=false;buttons();}};
el('logout').onclick=async()=>{const old=token;token='';state=null;pending=null;el('portal').hidden=true;el('login').hidden=false;el('history').replaceChildren();el('notice').textContent='Abgemeldet. Buchungen bleiben gespeichert.';try{await fetch(SUPABASE+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+old},signal:AbortSignal.timeout(15000)})}catch(error){el('notice').textContent+=' Die serverseitige Abmeldung konnte nicht bestätigt werden.'}};
setInterval(tick,1000);
</script></body></html>
